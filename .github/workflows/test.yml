name: Test Conversion

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect which files changed to determine which jobs to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      native: ${{ steps.filter.outputs.native }}
      python: ${{ steps.filter.outputs.python }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'Dockerfile'
              - 'src/**'
              - 'native/dk-md2pdf'
              - 'pyproject.toml'
              - '.python-version'
            native:
              - 'native/**'
              - 'bin/**'
              - 'src/**'
              - 'pyproject.toml'
              - '.python-version'
            python:
              - 'src/python/**'
              - 'tests/test_*.py'
              - 'pyproject.toml'
              - '.python-version'
            tests:
              - 'tests/**'
            examples:
              - 'examples/**'

  test-native:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    name: Test Native Installation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          npm install -g @mermaid-js/mermaid-cli

      - name: Install Python dependencies with uv
        run: |
          uv sync

      - name: Test basic conversion
        run: |
          ./native/dk-md2pdf examples/basic.md /tmp/basic.pdf
          test -f /tmp/basic.pdf

      - name: Test HTML output
        run: |
          ./native/dk-md2pdf -f html examples/basic.md /tmp/basic.html
          test -f /tmp/basic.html

      - name: Test with mermaid diagrams
        run: |
          ./native/dk-md2pdf examples/mermaid-diagrams.md /tmp/mermaid.pdf
          test -f /tmp/mermaid.pdf

      - name: Test with themes
        run: |
          ./native/dk-md2pdf -t academic examples/complex-document.md /tmp/academic.pdf
          ./native/dk-md2pdf -t minimal examples/complex-document.md /tmp/minimal.pdf
          test -f /tmp/academic.pdf
          test -f /tmp/minimal.pdf

      - name: Upload test outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-outputs
          path: /tmp/*.pdf

  test-docker:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    name: Test Docker Build

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: DOCKER_BUILDKIT=1 docker build -t dataknobs/md-tools -f docker/Dockerfile .

      - name: Test Docker conversion
        run: |
          docker run --rm -v $(pwd):/workspace dataknobs/md-tools \
            examples/basic.md basic-docker.pdf
          test -f basic-docker.pdf

      - name: Test Docker HTML output
        run: |
          docker run --rm -v $(pwd):/workspace dataknobs/md-tools \
            -f html examples/basic.md basic-docker.html
          test -f basic-docker.html

      - name: Test Docker with mermaid
        run: |
          docker run --rm -v $(pwd):/workspace dataknobs/md-tools \
            examples/mermaid-diagrams.md mermaid-docker.pdf
          test -f mermaid-docker.pdf

      - name: Upload Docker outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-test-outputs
          path: '*-docker.*'

  test-wrapper:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.native == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    name: Test Universal Wrapper

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: DOCKER_BUILDKIT=1 docker build -t dataknobs/md-tools -f docker/Dockerfile .

      - name: Test wrapper auto-detection
        run: |
          ./bin/dk-md2pdf examples/basic.md wrapper.pdf
          test -f wrapper.pdf

      - name: Test HTML wrapper
        run: |
          ./bin/dk-md2html examples/basic.md wrapper.html
          test -f wrapper.html

  test-python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    name: Test Python Unit Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run pytest
        run: |
          uv run pytest tests/ -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            .coverage
            htmlcov/

  validate-examples:
    needs: changes
    if: ${{ needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    name: Validate Example Files

    steps:
      - uses: actions/checkout@v4

      - name: Check example files exist
        run: |
          test -f examples/basic.md
          test -f examples/mermaid-diagrams.md
          test -f examples/complex-document.md

      - name: Validate markdown syntax
        run: |
          npm install -g markdownlint-cli
          markdownlint examples/*.md || true