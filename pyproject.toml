[project]
name = "dataknobs-md-tools"
version = "0.1.0"
description = "Markdown to PDF conversion tools with Mermaid diagram support"
requires-python = ">=3.11"
dependencies = [
    "weasyprint",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
